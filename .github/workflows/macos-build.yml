name: Build Macos
on: [push, pull_request]
jobs:
  build:
    name: Build Macos
    runs-on: macos-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install Crystal libs
        run: shards install
      - name: Build project
        run: make